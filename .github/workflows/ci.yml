name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install pricing wheel
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt

      - name: Install dashboard dependencies
        run: npm --prefix web ci --ignore-scripts --no-audit --no-fund

      - name: Prove UTC range regression rejects the defective baseline
        run: |
          cp options_lab/schema.py /tmp/fixed-schema.py
          trap 'cp /tmp/fixed-schema.py options_lab/schema.py' EXIT
          git show 4fc831c6d9e9aac5fb2d2916d1ff691997f273d7:options_lab/schema.py > options_lab/schema.py
          if python -m unittest test.test_engine.RiskTests.test_timestamp_utc_range_rejected_as_input_error > /tmp/baseline.log 2>&1; then
            cat /tmp/baseline.log
            echo "Baseline unexpectedly passed"
            exit 1
          fi
          cat /tmp/baseline.log
          grep 'OverflowError' /tmp/baseline.log

      - parallel:
          - name: Test accounting and local API
            run: python -m unittest discover -s test -v

          - name: Validate reproducible fixture
            run: python -m options_lab validate --input fixtures/rally.json

          - name: Validate offline provider conversion
            run: |
              python -m options_lab import-marketdata --input fixtures/providers/marketdata-historical.json --metadata fixtures/providers/marketdata-historical.meta.json > /tmp/marketdata-offline.json
              python -m options_lab validate --input /tmp/marketdata-offline.json
              python -m options_lab audit-marketdata --input fixtures/providers/marketdata-historical.json --metadata fixtures/providers/marketdata-historical.meta.json

          - name: Lint
            run: npm --prefix web run lint

          - name: Test frontend boundaries
            run: npm --prefix web test

          - name: Check formatting
            run: npm --prefix web run format:check

          - name: Typecheck
            run: npm --prefix web run check

          - name: Build local dashboard
            run: npm --prefix web run build

      - name: Install browser
        run: npm --prefix web exec -- playwright-core install --with-deps chromium

      - name: Prove fixture race regression rejects the defective baseline
        run: |
          cp web/src/app.tsx /tmp/fixed-app.tsx
          trap 'cp /tmp/fixed-app.tsx web/src/app.tsx' EXIT
          git show 4fc831c6d9e9aac5fb2d2916d1ff691997f273d7:web/src/app.tsx > web/src/app.tsx
          npm --prefix web run build
          python -m options_lab serve --port 8792 &
          dashboard_pid=$!
          trap 'kill "$dashboard_pid"; cp /tmp/fixed-app.tsx web/src/app.tsx' EXIT
          if BROWSER_TEST=1 npm --prefix web test > /tmp/baseline-browser.log 2>&1; then
            cat /tmp/baseline-browser.log
            echo "Baseline unexpectedly passed"
            exit 1
          fi
          cat /tmp/baseline-browser.log
          grep 'expected false to be true' /tmp/baseline-browser.log

      - name: Rebuild fixed dashboard
        run: npm --prefix web run build

      - name: Test dashboard interactions
        run: |
          python -m options_lab serve --port 8792 &
          dashboard_pid=$!
          trap 'kill "$dashboard_pid"' EXIT
          BROWSER_TEST=1 npm --prefix web test

      - name: Install e2e engine browser
        run: npm --prefix web exec -- e2e-web install chromium --with-deps

      - name: Test deterministic e2e risk journey
        env:
          E2E_TELEMETRY_DISABLED: '1'
        run: |
          python -m options_lab serve --port 8792 &
          dashboard_pid=$!
          trap 'kill "$dashboard_pid"' EXIT
          cd web
          npx --no-install e2e run --reporter list,junit

      - name: Upload browser failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-evidence
          include-hidden-files: true
          path: |
            web/.e2e/report.json
            web/.e2e/junit.xml
            web/.e2e/results
            output/playwright
          if-no-files-found: warn
