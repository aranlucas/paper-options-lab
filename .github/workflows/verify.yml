name: Verify paper prototype

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: paper-options-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact reviewed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Install pricing wheel
        run: 'python -m pip install --only-binary=:all: -r requirements.txt'
      - name: Test accounting and local API
        run: python -m unittest discover -s tests -v
      - name: Validate reproducible fixture
        run: python -m options_lab validate --input fixtures/rally.json
      - name: Validate offline provider conversion
        run: |
          python -m options_lab import-marketdata --input fixtures/providers/marketdata-historical.json --metadata fixtures/providers/marketdata-historical.meta.json > /tmp/marketdata-offline.json
          python -m options_lab validate --input /tmp/marketdata-offline.json
          python -m options_lab audit-marketdata --input fixtures/providers/marketdata-historical.json --metadata fixtures/providers/marketdata-historical.meta.json
      - name: Install dashboard dependencies
        run: npm --prefix web ci --ignore-scripts --no-audit --no-fund
      - name: Check TypeScript
        run: npm --prefix web run check
      - name: Build local dashboard
        run: npm --prefix web run build
